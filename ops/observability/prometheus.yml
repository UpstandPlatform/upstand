global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/upstand-alerts.yml

scrape_configs:
  - job_name: upstand-schedules
    metrics_path: /metrics
    static_configs:
      - targets:
          - schedules:3002
  - job_name: upstand-server
    metrics_path: /_internal/metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/upstand_metrics_token
    static_configs:
      - targets:
          - server:3000
