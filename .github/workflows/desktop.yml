name: Desktop Client

on:
  pull_request:
    branches: [master, canary]
    paths:
      - "apps/desktop/**"
      - "apps/web/src/app/(marketing)/page.tsx"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - "biome.json"
      - ".github/workflows/desktop.yml"
  push:
    branches: [canary]
    paths:
      - "apps/desktop/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - "biome.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
          - name: macOS
            runner: macos-latest
          - name: Linux
            runner: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate desktop package
        run: |
          bun run --cwd apps/desktop lint
          bun run --cwd apps/desktop check-types
          bun run --cwd apps/desktop test

      - name: Package desktop app
        run: bun run --cwd apps/desktop package
