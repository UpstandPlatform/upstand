name: Release Recovery Rehearsal

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Immutable Git tag to validate
        required: false
        type: string
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  packages: read
  attestations: read

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_ref: ${{ steps.release.outputs.release_ref }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          REQUESTED_RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_RELEASE_REF" ]]; then
            release_ref="$REQUESTED_RELEASE_REF"
          else
            release_ref="$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" 'v*' | awk -F/ '{print $3}' | sort -V | tail -n 1)"
          fi
          [[ "$release_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Could not resolve a stable release tag" >&2
            exit 1
          }
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"

  recovery-rehearsal:
    needs: resolve-release
    uses: ./.github/workflows/release.yml
    # GitHub validates the permission ceiling of every job in a reusable
    # workflow before evaluating its conditions. The release workflow's
    # publication jobs are skipped below, but this caller must still permit
    # their declared maximum so the full recovery acceptance job can start.
    # The called workflow narrows permissions per job, and build/publish are
    # disabled for this rehearsal.
    permissions:
      contents: write
      packages: write
      actions: write
      id-token: write
      attestations: write
    with:
      release_ref: ${{ needs.resolve-release.outputs.release_ref }}
      acceptance_profile: full
      publish_release: false
      build_images: false
      attestation_source_ref: ${{ needs.resolve-release.outputs.release_ref }}
