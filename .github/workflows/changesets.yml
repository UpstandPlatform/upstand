name: Changesets Release PR

on:
  push:
    branches: [master, canary]
    paths:
      - ".changeset/**"
      - "apps/*/package.json"
      - "package.json"
      - "CHANGELOG.md"
  workflow_dispatch:

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    if: github.repository == 'UpstandPlatform/upstand'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: bun install --frozen-lockfile

      - name: Create or update release PR
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1
        with:
          version: bun run changeset:version
          commit: "chore: prepare release"
          title: "chore: prepare release"
          # The Changesets action prefixes this input with `changeset-release/`.
          # Using the merged branch ensures both the canary lane and stable
          # master lane receive a release PR from their consumed changesets.
          branch: ${{ github.ref_name }}
          commitMode: github-api
          # Prefer a narrowly scoped RELEASE_TOKEN when the organization
          # disables pull-request creation for GITHUB_TOKEN. If the
          # organization enables that setting, GITHUB_TOKEN remains sufficient.
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
