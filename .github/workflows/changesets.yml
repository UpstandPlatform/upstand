name: Changesets Release PR

on:
  push:
    branches: [canary]
    paths:
      - ".changeset/**"
      - "apps/*/package.json"
      - "package.json"
      - "CHANGELOG.md"
  workflow_dispatch:

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    if: github.repository == 'UpstandPlatform/upstand'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create or update release PR
        uses: changesets/action@v1.9.0
        with:
          version: bun run changeset:version
          commit: "chore: prepare release"
          title: "chore: prepare release"
          branch: changeset-release/canary
          commitMode: github-api
          github-token: ${{ secrets.GITHUB_TOKEN }}
