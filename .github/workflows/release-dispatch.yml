name: Dispatch Release and Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Immutable Git tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write
  actions: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      release_ref: ${{ inputs.release_ref }}
    secrets: inherit
