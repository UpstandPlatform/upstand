name: Publish Canary Images

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: [canary]
  workflow_dispatch:

concurrency:
  group: upstand-canary
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/canary') ||
        (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: .
            file: apps/server/Dockerfile
            scope: canary-upstand-server
            build_args: ""
          - name: schedules
            context: .
            file: apps/schedules/Dockerfile
            scope: canary-upstand-schedules
            build_args: ""
          - name: web
            context: .
            file: apps/web/Dockerfile
            scope: canary-upstand-web
            # The Next.js build is platform-independent but very slow under
            # arm64 emulation. Stable releases remain multi-architecture;
            # canary web images prioritize fast feedback on amd64 runners.
            platforms: linux/amd64
            build_args: |
              NEXT_PUBLIC_SERVER_URL=https://api.example.invalid
              NEXT_PUBLIC_UPSTAND_VERSION=canary
          - name: fumadocs
            context: .
            file: apps/fumadocs/Dockerfile
            scope: canary-upstand-fumadocs
            # Fumadocs is a Next.js build and is prohibitively slow under
            # arm64 emulation. Stable releases retain multi-architecture
            # publishing; canary prioritizes fast integration feedback.
            platforms: linux/amd64
            build_args: ""
          - name: monitoring
            context: apps/monitoring
            file: apps/monitoring/Dockerfile
            scope: canary-upstand-monitoring
            # Monitoring is a Go image, but its multi-architecture build also
            # pays the arm64 emulation cost. Stable releases retain
            # multi-architecture publishing; canary prioritizes fast feedback.
            platforms: linux/amd64
            build_args: ""
    env:
      NEXT_PUBLIC_SERVER_URL: https://api.example.invalid
    permissions:
      contents: read
      packages: write
      actions: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and Push ${{ matrix.name }}
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
          tags: ghcr.io/${{ steps.image.outputs.repository }}-${{ matrix.name }}:canary
          build-args: |
            ${{ matrix.build_args }}
            UPSTAND_VERSION=canary
            VCS_REF=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,scope=${{ matrix.scope }},mode=max,ignore-error=true
          provenance: mode=max
          sbom: true

      - name: Generate signed image provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/${{ steps.image.outputs.repository }}-${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
