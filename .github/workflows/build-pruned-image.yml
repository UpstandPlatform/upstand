name: Build pruned production image

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      context:
        type: string
        required: false
        default: .
      file:
        type: string
        required: true
      build_args:
        type: string
        required: false
        default: ""

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build ${{ inputs.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: false
          tags: upstand-${{ inputs.name }}:${{ github.sha }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha,scope=ci-${{ github.event_name }}-${{ inputs.name }}
          cache-to: type=gha,scope=ci-${{ github.event_name }}-${{ inputs.name }},mode=max,ignore-error=true
