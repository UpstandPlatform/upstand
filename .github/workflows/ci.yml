name: Continuous Integration

on:
  pull_request:
    branches: [master, canary]
  push:
    # Canary is the single post-merge integration validation lane. Master is
    # validated by the promotion PR and by the stable release workflow; a
    # second full push validation there only repeats the same work.
    branches: [canary]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The web app validates this at build time. It is deliberately a reserved
  # CI-only origin; deployments inject their real HTTPS API origin.
  NEXT_PUBLIC_SERVER_URL: https://api.example.invalid

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          # Turbo task hashes already include the source and dependency state;
          # keeping the branch out of this key lets PRs reuse the canary cache.
          key: ${{ runner.os }}-turbo-${{ github.workflow }}-${{ hashFiles('bun.lock', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - name: Check changed formatting and lint
        env:
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: bunx biome check --changed --since "origin/${BASE_BRANCH}" --no-errors-on-unmatched
      - name: Verify release changeset
        # The generated release PR and the canary promotion intentionally
        # contain consumed changesets plus generated versions/changelogs.
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref != 'changeset-release/canary' &&
          github.head_ref != 'canary'
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"

          # Changesets watches package directories broadly, but Dockerfiles,
          # workflow files, and other build metadata do not need a version bump.
          # Keep the release check focused on files that ship in a package.
          if printf '%s\n' "$changed_files" | grep -Eq \
            '^(apps|packages)/[^/]+/(src|content|public)/|^(apps|packages)/[^/]+/package\.json$'; then
            bun run changeset:status --since="origin/${{ github.base_ref }}"
          else
            echo "No releasable package files changed; a changeset is not required."
          fi
      - name: Verify generated database migrations
        env:
          BETTER_AUTH_URL: http://localhost:3000
          CORS_ORIGIN: http://localhost:3001
          BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/upstand
        run: |
          bun run db:generate
          bun run db:check
          git diff --exit-code -- packages/db/src/migrations packages/db/src/schema
      - name: Check affected types
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref != 'canary' &&
          github.head_ref != 'changeset-release/canary'
        run: bunx turbo run check-types --filter="...[origin/${{ github.base_ref }}]"
      - name: Check all types
        if: github.event_name != 'pull_request'
        run: bun run check-types
      - name: Test affected packages
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref != 'canary' &&
          github.head_ref != 'changeset-release/canary'
        run: bunx turbo run test --filter="...[origin/${{ github.base_ref }}]"
      - name: Test all packages
        if: github.event_name != 'pull_request'
        run: bun run test
      - name: Build all applications
        # Canary image builds are the production-shaped application build
        # validation. Keep this broad build for an explicit manual run, but do
        # not compile every app once in CI and then compile them again in the
        # canonical canary image workflow.
        if: github.event_name == 'workflow_dispatch'
        run: bun run build

  docker-builds:
    name: Build pruned ${{ matrix.name }} image
    # The canary image workflow is the canonical image build/publish lane.
    # Keep this matrix available for an explicit workflow_dispatch, but do
    # not rebuild the same images on every PR or canary push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            file: apps/server/Dockerfile
            build_args: ""
          - name: web
            file: apps/web/Dockerfile
            build_args: |
              NEXT_PUBLIC_SERVER_URL=https://api.example.invalid
              NEXT_PUBLIC_UPSTAND_VERSION=ci
          - name: fumadocs
            file: apps/fumadocs/Dockerfile
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: upstand-${{ matrix.name }}:${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,scope=ci-${{ matrix.name }},mode=max,ignore-error=true

  merge-gate:
    name: Merge gate
    if: always()
    needs: [verify, docker-builds]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require validation jobs to pass
        if: >-
          needs.verify.result != 'success' ||
          (needs.docker-builds.result != 'success' && needs.docker-builds.result != 'skipped')
        run: |
          echo "verify=${{ needs.verify.result }}"
          echo "docker-builds=${{ needs.docker-builds.result }}"
          exit 1
      - name: Report merge readiness
        run: echo "Required CI validation passed."
