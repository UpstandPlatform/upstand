name: Release and Publish Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      release_ref:
        description: Git tag or ref to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Next.js validates this public build-time variable even though CI does
      # not connect to a live API. Production installers provide the real URL.
      NEXT_PUBLIC_SERVER_URL: https://api.example.invalid
      RELEASE_REF: ${{ inputs.release_ref || github.ref }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          fetch-depth: 0

      - name: Ensure release commit is on stable branch
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$(git rev-parse "${RELEASE_REF}^{commit}")" origin/master

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Verify database schema consistency
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/upstand
        run: bun run db:check

      - name: Verify lint, security, and production shell syntax
        run: |
          bun run lint
          bun audit
          bash -n install.sh
          bash -n apps/server/docker-entrypoint.sh

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-release-${{ hashFiles('bun.lock', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-release-${{ hashFiles('bun.lock', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Check Types
        run: bun run check-types

      - name: Run Tests
        run: bun run test

  build-and-publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: .
            file: apps/server/Dockerfile
            scope: upstand-server
            build_args: ""
          - name: schedules
            context: .
            file: apps/schedules/Dockerfile
            scope: upstand-schedules
            build_args: ""
          - name: web
            context: .
            file: apps/web/Dockerfile
            scope: upstand-web
            build_args: |
              NEXT_PUBLIC_SERVER_URL=https://api.example.invalid
              NEXT_PUBLIC_UPSTAND_VERSION=${{ inputs.release_ref || github.ref_name }}
          - name: fumadocs
            context: .
            file: apps/fumadocs/Dockerfile
            scope: upstand-fumadocs
            build_args: ""
          - name: monitoring
            context: apps/monitoring
            file: apps/monitoring/Dockerfile
            scope: upstand-monitoring
            build_args: ""
    permissions:
      contents: read
      packages: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        env:
          RELEASE_REF: ${{ inputs.release_ref || github.ref }}
        run: |
          TAG_NAME="${RELEASE_REF##*/}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          echo "repo=${REPO_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Build and Push ${{ matrix.name }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}-${{ matrix.name }}:${{ steps.meta.outputs.tag }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,scope=${{ matrix.scope }},mode=max
          provenance: mode=max
          sbom: true

  build-desktop:
    needs: verify
    name: Build desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
          - name: macos
            runner: macos-latest
          - name: linux
            runner: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build installers
        run: bun run --cwd apps/desktop make

      - name: Upload desktop release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.name }}
          path: apps/desktop/out/make/**
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: startsWith(inputs.release_ref || github.ref_name, 'v')
    needs: [build-and-publish, build-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    steps:
      - name: Download desktop release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: desktop-*
          path: ${{ runner.temp }}/desktop-assets

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all release images and create manifest
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.release_ref || github.ref_name }}
        run: |
          set -euo pipefail
          repo="${GH_REPO,,}"
          manifest_file="$RUNNER_TEMP/upstand-release-manifest.json"
          images='[]'

          for name in server schedules web fumadocs monitoring; do
            image="ghcr.io/${repo}-${name}:${RELEASE_VERSION}"
            inspect="$(docker buildx imagetools inspect "$image")"
            digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "$inspect")"
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Could not verify immutable digest for $image" >&2
              exit 1
            fi
            images="$(jq --arg name "$name" --arg image "$image" --arg digest "$digest" '. + [{name: $name, image: $image, digest: $digest}]' <<< "$images")"
          done

          jq -n \
            --arg version "$RELEASE_VERSION" \
            --argjson images "$images" \
            '{schemaVersion: 1, version: $version, images: $images}' \
            > "$manifest_file"

          cat "$manifest_file"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_ref || github.ref_name }}
          MANIFEST_FILE: ${{ runner.temp }}/upstand-release-manifest.json
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find "$RUNNER_TEMP/desktop-assets" -type f \
              \( -name '*.deb' -o -name '*.dmg' -o -name '*.exe' -o -name '*.nupkg' -o -name '*.zip' \) \
              -print0
          )
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "Desktop release assets were not downloaded" >&2
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists; refusing to overwrite immutable release assets" >&2
            exit 1
          else
            gh release create "$RELEASE_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Upstand $RELEASE_VERSION" \
              --generate-notes \
              "$MANIFEST_FILE#upstand-release-manifest.json" \
              "${assets[@]}"
          fi
