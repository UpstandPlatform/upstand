name: Create Stable Release Tag

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: stable-tag-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: github.repository == 'UpstandPlatform/upstand'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Create release tag when the version advanced
        run: bun run release:tag

      - name: Dispatch Docker release for the stable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="$(node -p "require('./package.json').version")"
          gh workflow run "Dispatch Release and Publish Docker Images" \
            --repo "$GITHUB_REPOSITORY" \
            --ref canary \
            -f "release_ref=v${release_version}"
